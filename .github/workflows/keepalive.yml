name: Supabase Keepalive

on:
  schedule:
    # Daily — gives a buffer so one missed/failed run can't blow past the 7-day window
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keepalive row
        run: |
          status=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            --retry 3 --retry-connrefused --max-time 30 \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pinged_at\": \"$(date -u +%FT%TZ)\"}")
          echo "HTTP $status"
          cat /tmp/resp.txt
          if [ "$status" != "201" ]; then
            echo "Keepalive insert did not return 201 — failing the job."
            exit 1
          fi